{% extends "emails/base.html" %}
{% block content %}

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
  <tr>
    <td align="center" style="padding:24px; border-radius:18px; background:#faf5ff; border:1px solid #e9d5ff;">
      <div style="font-size:38px; line-height:1; letter-spacing:8px; font-weight:800; color:#7928ca;">{{ otp_code }}</div>
